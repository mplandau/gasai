<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelPulse AI - Intelligent Gas Price Forecaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        function GasForecastApp() {
            const [location] = React.useState('Lakewood, NJ');
            const [selectedScenario, setSelectedScenario] = React.useState('normal');
            const [filterGrade, setFilterGrade] = React.useState('All');

            const localStations = [
                { id: 1, name: 'Costco Wholesale', address: 'Standard Blvd', price: 4.09, grade: 'Regular', cheapest: true, distance: '1.2 mi' },
                { id: 2, name: 'QuickChek', address: '125 River Ave', price: 4.21, grade: 'Regular', distance: '0.8 mi' },
                { id: 3, name: 'Exxon', address: 'Route 9 North', price: 4.35, grade: 'Regular', distance: '2.1 mi' },
                { id: 4, name: 'Shell', address: 'Linden Ave', price: 4.39, grade: 'Premium', distance: '1.5 mi' },
                { id: 5, name: 'BP', address: 'Crest St', price: 4.28, grade: 'Mid-Grade', distance: '1.9 mi' }
            ];

            const scenarios = {
                normal: { label: 'Baseline Trend', multiplier: 1.0, description: 'Normal seasonal supply and standard refinery output levels.' },
                wartime: { label: 'Geopolitical Shock', multiplier: 1.14, description: 'Transit chokepoint disruptions driving crude benchmarks higher.' },
                opec_cut: { label: 'OPEC+ Curtailment', multiplier: 1.07, description: 'Tightened global barrel export quotas elevating wholesale costs.' },
            };

            const currentAverage = 4.32;
            const projectedPrice = (currentAverage * scenarios[selectedScenario].multiplier).toFixed(2);
            const priceDiff = (projectedPrice - currentAverage).toFixed(2);
            const isUp = priceDiff > 0;

            const filteredStations = localStations.filter(s => 
                filterGrade === 'All' || s.grade === filterGrade
            );

            return (
                <div className="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black p-4 md:p-8">
                    <div className="max-w-4xl mx-auto space-y-6">
                        
                        {/* Header */}
                        <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800/80 pb-5 gap-4">
                            <div>
                                <h1 className="text-2xl font-black tracking-tight flex items-center gap-2.5">
                                    <span className="flex h-3 w-3 relative">
                                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                      <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                                    </span>
                                    FuelPulse <span className="text-emerald-400 font-light">AI</span>
                                </h1>
                                <p className="text-xs text-slate-400 font-medium mt-0.5">Predictive local pricing & macroeconomic impact simulation</p>
                            </div>
                            <div className="flex items-center gap-2 bg-slate-900/90 border border-slate-800/80 px-3.5 py-1.5 rounded-full shadow-inner">
                                <span className="text-emerald-400">📍</span>
                                <span className="text-xs font-semibold tracking-wide text-slate-200">{location}</span>
                            </div>
                        </header>

                        {/* Main Prediction Card */}
                        <section className="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-96 h-96 bg-emerald-500/5 rounded-full blur-3xl pointer-events-none"></div>
                            
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                                <div>
                                    <span className="text-[11px] uppercase tracking-wider text-emerald-400 font-bold bg-emerald-950/80 px-3 py-1 rounded-full border border-emerald-800/40">
                                        AI 7-Day Forecast Engine
                                    </span>
                                    <h2 className="text-lg font-bold text-slate-200 mt-2.5">Projected Regional Average</h2>
                                </div>
                                <div className="text-left sm:text-right">
                                    <div className="text-4xl font-black tracking-tight text-white">${projectedPrice}</div>
                                    <div className={`text-xs flex items-center sm:justify-end gap-1 mt-1 font-semibold ${isUp ? 'text-rose-400' : 'text-emerald-400'}`}>
                                        <span>{isUp ? `▲ +$${priceDiff}` : `▼ $${priceDiff}`}</span> 
                                        <span className="text-slate-500 font-normal">vs current (${currentAverage})</span>
                                    </div>
                                </div>
                            </div>

                            {/* Mini Trend Visualizer */}
                            <div className="bg-slate-950/60 border border-slate-800/60 rounded-xl p-4 mb-6">
                                <div className="flex justify-between items-center text-xs text-slate-400 mb-2 font-medium">
                                    <span>7-Day Trajectory Curve</span>
                                    <span className="text-emerald-400 font-mono">Confidence: 94.2%</span>
                                </div>
                                <div className="h-12 flex items-end gap-1.5 pt-2">
                                    {[4.31, 4.30, 4.32, 4.33, Number(projectedPrice)-0.03, Number(projectedPrice)-0.01, Number(projectedPrice)].map((val, idx) => {
                                        const heightPercent = Math.max(25, ((val - 4.0) / 0.6) * 100);
                                        const isLast = idx === 6;
                                        return (
                                            <div key={idx} className="flex-1 flex flex-col items-center gap-1 group relative">
                                                <div 
                                                    style={{ height: `${heightPercent}%` }} 
                                                    className={`w-full rounded-t transition-all duration-300 ${isLast ? 'bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.4)]' : 'bg-slate-800 group-hover:bg-slate-700'}`}
                                                ></div>
                                                <span className="text-[9px] text-slate-500">D{idx+1}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Scenarios Selector */}
                            <div>
                                <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-2.5">
                                    Simulate Macroeconomic Conditions
                                </label>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    {Object.entries(scenarios).map(([key, data]) => (
                                        <button
                                            key={key}
                                            onClick={() => setSelectedScenario(key)}
                                            className={`text-left p-3.5 rounded-xl border text-xs transition-all duration-200 ${
                                                selectedScenario === key 
                                                    ? 'bg-emerald-950/30 border-emerald-500/80 text-emerald-200 shadow-md ring-1 ring-emerald-500/20' 
                                                    : 'bg-slate-950/40 border-slate-800/80 text-slate-400 hover:border-slate-700 hover:bg-slate-900/50'
                                            }`}
                                        >
                                            <div className="font-bold text-slate-200">{data.label}</div>
                                            <p className="mt-1.5 text-[11px] text-slate-500 leading-relaxed">{data.description}</p>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* Local Stations Section */}
                        <section className="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-6 shadow-xl">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-5">
                                <h2 className="text-base font-bold text-slate-200 flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                                    Local Station Watcher
                                </h2>
                                
                                {/* Filter Pills */}
                                <div className="flex items-center gap-1.5 bg-slate-950/80 p-1 rounded-lg border border-slate-800">
                                    {['All', 'Regular', 'Mid-Grade', 'Premium'].map((grade) => (
                                        <button
                                            key={grade}
                                            onClick={() => setFilterGrade(grade)}
                                            className={`px-2.5 py-1 text-[11px] font-medium rounded-md transition-colors ${
                                                filterGrade === grade 
                                                    ? 'bg-emerald-500 text-slate-950 font-bold shadow' 
                                                    : 'text-slate-400 hover:text-slate-200'
                                            }`}
                                        >
                                            {grade}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-2.5">
                                {filteredStations.map((station) => (
                                    <div 
                                        key={station.id} 
                                        className={`flex items-center justify-between p-4 rounded-xl border transition-all ${
                                            station.cheapest 
                                                ? 'bg-emerald-950/20 border-emerald-500/50 shadow-sm' 
                                                : 'bg-slate-950/40 border-slate-800/80 hover:border-slate-700'
                                        }`}
                                    >
                                        <div className="space-y-0.5">
                                            <div className="flex items-center gap-2">
                                                <span className="font-bold text-sm text-slate-200">{station.name}</span>
                                                {station.cheapest && (
                                                    <span className="bg-emerald-500 text-slate-950 text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full">
                                                        Best Value
                                                    </span>
                                                )}
                                            </div>
                                            <div className="flex items-center gap-2 text-xs text-slate-400">
                                                <span>{station.address}</span>
                                                <span>•</span>
                                                <span className="text-slate-500">{station.distance}</span>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-lg font-black text-emerald-400">${station.price}</span>
                                            <span className="block text-[10px] uppercase tracking-wider font-semibold text-slate-500">{station.grade}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                    </div>
                </div>
            );
        }

        ReactDOM.render(<GasForecastApp />, document.getElementById('root'));
    </script>
</body>
</html>
