<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelPulse AI - Gas Price Forecaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function GasForecastApp() {
            const [location] = React.useState('Lakewood, NJ');
            const [selectedScenario, setSelectedScenario] = React.useState('normal');

            const localStations = [
                { id: 1, name: 'QuickChek', address: '125 River Ave', price: 4.21, grade: 'Regular' },
                { id: 2, name: 'Costco (Lakewood)', address: 'Standard Blvd', price: 4.09, grade: 'Regular', cheapest: true },
                { id: 3, name: 'Exxon', address: 'Route 9', price: 4.35, grade: 'Regular' },
                { id: 4, name: 'Shell', address: 'Linden Ave', price: 4.39, grade: 'Regular' },
            ];

            const scenarios = {
                normal: { label: 'Normal Market Conditions', multiplier: 1.0, description: 'Stable seasonal supply and standard refinery output.' },
                wartime: { label: 'Wartime / Supply Shock', multiplier: 1.14, description: 'Geopolitical disruption in key transit routes driving crude spikes.' },
                opec_cut: { label: 'OPEC+ Production Cut', multiplier: 1.07, description: 'Restricted global crude barrels lifting wholesale costs.' },
            };

            const currentAverage = 4.32;
            const projectedPrice = (currentAverage * scenarios[selectedScenario].multiplier).toFixed(2);
            const priceDiff = (projectedPrice - currentAverage).toFixed(2);
            const isUp = priceDiff > 0;

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-4xl mx-auto space-y-6">
                        
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-4 gap-4">
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight flex items-center gap-2">
                                    <span className="text-emerald-400">⛽</span> FuelPulse AI Forecaster
                                </h1>
                                <p className="text-sm text-slate-400">Predictive local gas intelligence & scenario modeling</p>
                            </div>
                            <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg">
                                <span className="text-emerald-400 font-bold">📍</span>
                                <span className="text-sm font-medium">{location}</span>
                            </div>
                        </div>

                        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 relative overflow-hidden shadow-lg">
                            <div className="flex justify-between items-start mb-4">
                                <div>
                                    <span className="text-xs uppercase tracking-wider text-emerald-400 font-semibold bg-emerald-950/60 px-2.5 py-1 rounded-full border border-emerald-800/50">
                                        AI 7-Day Outlook
                                    </span>
                                    <h2 className="text-xl font-bold mt-2">Projected Price Next Week</h2>
                                </div>
                                <div className="text-right">
                                    <span className="text-3xl font-black">${projectedPrice}</span>
                                    <div className={`text-xs flex items-center justify-end gap-1 mt-1 font-medium ${isUp ? 'text-rose-400' : 'text-emerald-400'}`}>
                                        {isUp ? `+${priceDiff}` : priceDiff} vs today (${currentAverage})
                                    </div>
                                </div>
                            </div>

                            <div className="mt-6 pt-4 border-t border-slate-800">
                                <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">
                                    Simulate Global Market / Geopolitical Scenarios
                                </label>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                    {Object.entries(scenarios).map(([key, data]) => (
                                        <button
                                            key={key}
                                            onClick={() => setSelectedScenario(key)}
                                            className={`text-left p-3 rounded-lg border text-xs transition-all ${
                                                selectedScenario === key 
                                                    ? 'bg-emerald-950/40 border-emerald-500 text-emerald-200 shadow-sm' 
                                                    : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'
                                            }`}
                                        >
                                            <div className="font-bold">{data.label}</div>
                                            <p className="mt-1 text-[11px] text-slate-500 leading-relaxed">{data.description}</p>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                    Cheapest Stations in Town
                                </h2>
                                <span className="text-xs text-slate-500">Updated recently</span>
                            </div>

                            <div className="space-y-3">
                                {localStations.map((station) => (
                                    <div 
                                        key={station.id} 
                                        className={`flex items-center justify-between p-3.5 rounded-lg border ${
                                            station.cheapest 
                                                ? 'bg-emerald-950/20 border-emerald-500/40' 
                                                : 'bg-slate-950 border-slate-800'
                                        }`}
                                    >
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <span className="font-semibold text-sm">{station.name}</span>
                                                {station.cheapest && (
                                                    <span className="bg-emerald-500 text-slate-950 text-[10px] font-black uppercase px-1.5 py-0.5 rounded">
                                                        Lowest Price
                                                    </span>
                                                )}
                                            </div>
                                            <span className="text-xs text-slate-400">{station.address}</span>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-lg font-bold text-emerald-400">${station.price}</span>
                                            <span className="block text-[10px] text-slate-500">{station.grade}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        ReactDOM.render(<GasForecastApp />, document.getElementById('root'));
    </script>
</body>
</html>
